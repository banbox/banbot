        taker: 0.0005
        maker: 0.0002
database:  # 数据库配置
  db_type: questdb # questdb / timescale；不填时由 URL 自动识别
  # sid_registry_url: postgresql://user:password@127.0.0.1:5432/banbot # QuestDB 多写进程 SID 注册库
