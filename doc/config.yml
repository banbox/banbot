  url: postgresql://admin:quest@127.0.0.1:8812/qdb?sslmode=disable
spider_addr: 127.0.0.1:6789  # 爬虫监听的端口和地址
rpc_channels:  # 支持的全部rpc渠道
  mail1:
    type: mail
